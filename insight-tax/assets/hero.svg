<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-label="Illustration of an Australian tax return being prepared online and lodged with the ATO">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f0fa"/>
      <stop offset="1" stop-color="#fff1e3"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173a63"/>
      <stop offset="1" stop-color="#0f2a4a"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f2a4a" flood-opacity="0.16"/>
    </filter>
    <clipPath id="globeClip"><circle cx="0" cy="0" r="46"/></clipPath>
  </defs>

  <!-- backdrop -->
  <path d="M86 70 C 190 -6, 420 6, 520 86 C 610 158, 600 330, 520 418 C 430 516, 210 528, 110 450 C 18 378, -10 140, 86 70 Z" fill="url(#bg)"/>
  <g fill="#ff8a1f" opacity="0.35">
    <circle cx="70" cy="120" r="5"/><circle cx="545" cy="70" r="4"/><circle cx="560" cy="420" r="6"/><circle cx="40" cy="390" r="4"/>
  </g>
  <g stroke="#0f2a4a" stroke-opacity="0.08" stroke-width="2">
    <path d="M60 250 h40 M80 230 v40"/><path d="M520 250 h30 M535 235 v30"/>
  </g>

  <!-- main return card -->
  <g filter="url(#sh)">
    <rect x="150" y="70" width="300" height="370" rx="22" fill="#ffffff"/>
  </g>
  <rect x="150" y="70" width="300" height="74" rx="22" fill="url(#navy)"/>
  <rect x="150" y="122" width="300" height="22" fill="#0f2a4a"/>
  <text x="176" y="103" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="13" font-weight="600" fill="#9fb6d3" letter-spacing="1.2">INDIVIDUAL TAX RETURN</text>
  <text x="176" y="128" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="21" font-weight="800" fill="#ffffff">2025 to 2026</text>
  <rect x="368" y="96" width="60" height="26" rx="13" fill="#ff8a1f"/>
  <text x="398" y="114" text-anchor="middle" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">AU</text>

  <!-- checklist rows -->
  <g font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="14" fill="#0f2a4a">
    <g transform="translate(176 172)">
      <circle cx="11" cy="11" r="11" fill="#e3f6ec"/><path d="M6 11.5 l3.5 3.5 l7 -7.5" stroke="#1f9d5a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="34" y="16" font-weight="600">Salary and wages</text>
      <rect x="196" y="5" width="52" height="12" rx="6" fill="#e8eef6"/>
    </g>
    <g transform="translate(176 214)">
      <circle cx="11" cy="11" r="11" fill="#e3f6ec"/><path d="M6 11.5 l3.5 3.5 l7 -7.5" stroke="#1f9d5a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="34" y="16" font-weight="600">Foreign income</text>
      <rect x="196" y="5" width="52" height="12" rx="6" fill="#e8eef6"/>
    </g>
    <g transform="translate(176 256)">
      <circle cx="11" cy="11" r="11" fill="#e3f6ec"/><path d="M6 11.5 l3.5 3.5 l7 -7.5" stroke="#1f9d5a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="34" y="16" font-weight="600">Work deductions</text>
      <rect x="196" y="5" width="52" height="12" rx="6" fill="#e8eef6"/>
    </g>
    <g transform="translate(176 298)">
      <circle cx="11" cy="11" r="11" fill="#fff1e3"/><circle cx="11" cy="11" r="4" fill="#ff8a1f"/>
      <text x="34" y="16" font-weight="600">Rental property</text>
      <rect x="196" y="5" width="52" height="12" rx="6" fill="#ffe3c7"/>
    </g>
  </g>

  <!-- progress -->
  <text x="176" y="362" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="12" font-weight="700" fill="#5b6b80" letter-spacing="0.8">READY FOR REVIEW</text>
  <text x="424" y="362" text-anchor="end" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="12" font-weight="800" fill="#0f2a4a">85%</text>
  <rect x="176" y="372" width="248" height="10" rx="5" fill="#e8eef6"/>
  <rect x="176" y="372" width="211" height="10" rx="5" fill="#ff8a1f"/>
  <rect x="176" y="398" width="248" height="22" rx="11" fill="#f3f6fa"/>
  <text x="300" y="413" text-anchor="middle" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="11" font-weight="600" fill="#5b6b80">Prepared by a Registered Tax Agent</text>

  <!-- lodged badge -->
  <g filter="url(#sh)" transform="translate(392 418)">
    <rect width="190" height="74" rx="18" fill="#ffffff"/>
    <circle cx="38" cy="37" r="22" fill="#1f9d5a"/>
    <path d="M28 38 l7 7 l13 -14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="70" y="33" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="15" font-weight="800" fill="#0f2a4a">Lodged</text>
    <text x="70" y="52" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="12" font-weight="600" fill="#5b6b80">with the ATO</text>
  </g>

  <!-- globe card -->
  <g filter="url(#sh)" transform="translate(-4 168)">
    <rect width="150" height="150" rx="22" fill="#ffffff"/>
    <g transform="translate(75 70)">
      <circle r="46" fill="#e8f0fa"/>
      <g clip-path="url(#globeClip)" fill="#bcd0e8">
        <path d="M-40 -22 c10 -10 26 -12 34 -4 c6 6 2 16 -6 18 c-8 2 -10 12 -18 12 c-8 0 -14 -12 -10 -26 z"/>
        <path d="M14 10 c10 -6 26 -4 30 6 c4 10 -4 20 -16 20 c-10 0 -20 -16 -14 -26 z" fill="#ffc48a"/>
        <path d="M6 -36 c8 -2 18 2 20 10 c-6 4 -16 4 -22 -2 z"/>
      </g>
      <circle r="46" fill="none" stroke="#0f2a4a" stroke-opacity="0.12" stroke-width="2"/>
      <path d="M-24 -10 C -10 -54, 40 -40, 30 16" stroke="#ff8a1f" stroke-width="2.5" fill="none" stroke-dasharray="5 5" stroke-linecap="round"/>
      <circle cx="-24" cy="-10" r="4.5" fill="#0f2a4a"/>
      <circle cx="30" cy="16" r="5.5" fill="#ff8a1f"/>
    </g>
    <text x="75" y="138" text-anchor="middle" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="12" font-weight="700" fill="#0f2a4a">Living across borders</text>
  </g>

  <!-- chat bubble -->
  <g filter="url(#sh)" transform="translate(380 14)">
    <rect width="196" height="64" rx="18" fill="#ffffff"/>
    <circle cx="32" cy="32" r="18" fill="#0f2a4a"/>
    <text x="32" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="14" font-weight="800" fill="#ff8a1f">RA</text>
    <text x="60" y="28" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="12" font-weight="800" fill="#0f2a4a">Your accountant</text>
    <text x="60" y="46" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="12" font-weight="500" fill="#5b6b80">Draft is ready to review</text>
  </g>

  <!-- coins -->
  <g transform="translate(84 400)">
    <ellipse cx="30" cy="40" rx="30" ry="9" fill="#e07812"/>
    <rect x="0" y="22" width="60" height="18" fill="#ff8a1f"/>
    <ellipse cx="30" cy="22" rx="30" ry="9" fill="#ffad5c"/>
    <ellipse cx="30" cy="18" rx="30" ry="9" fill="#e07812"/>
    <rect x="0" y="0" width="60" height="18" fill="#ff8a1f"/>
    <ellipse cx="30" cy="0" rx="30" ry="9" fill="#ffc48a"/>
    <text x="30" y="5" text-anchor="middle" font-family="'Plus Jakarta Sans',Arial,sans-serif" font-size="11" font-weight="800" fill="#b65d07">$</text>
  </g>
</svg>
